[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "aip-mcp-server"
version = "0.1.0"
description = "MCP server for the Applied Innovation Platform - 14 AI agents for multi-dimensional innovation analysis"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Bob Holzer"}]
dependencies = [
    "mcp[cli]>=1.0",
    "litellm>=1.40",
    "pydantic>=2.0",
    "anthropic>=0.80",
    "uvicorn>=0.25",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
